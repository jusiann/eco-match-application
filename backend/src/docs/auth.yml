openapi: 3.0.0
info:
  title: EcoMatch API - Auth
  description: Authentication and Authorization API documentation
  version: 1.0.0
paths:
  /v1/auth/register:
    post:
      summary: Register a new facility and its first user (facility_admin)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - taxId
                - sector
                - email
                - password
                - contactName
                - phone
                - location
              properties:
                name:
                  type: string
                  description: Tesis adı
                taxId:
                  type: string
                  description: Vergi numarası (10 hane)
                sector:
                  type: string
                  description: Sektör alanı
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                contactName:
                  type: string
                  description: Yetkili kişi adı
                phone:
                  type: string
                osbId:
                  type: string
                  format: uuid
                  nullable: true
                location:
                  type: object
                  required: [lat, lng]
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
      responses:
        '201':
          description: Facility and first user created, refresh token set as HttpOnly cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  user:
                    type: object
                  facility:
                    type: object
        '400':
          description: Bad request (validation error, duplicate email/tax id, unknown osbId)
  /v1/auth/login:
    post:
      summary: Login user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '201':
          description: Successful login, refresh token set as HttpOnly cookie (not in body)
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  user:
                    type: object
        '401':
          description: Unauthorized
  /v1/auth/refresh:
    post:
      summary: Exchange the HttpOnly refresh cookie for a new access/refresh pair
      description: Refresh tokens are rotated on every use -- the old one stops working immediately. The refresh token is read from the `refresh_token` cookie, never from the body.
      tags:
        - Auth
      responses:
        '201':
          description: New access_token returned, new refresh cookie set
        '401':
          description: Refresh cookie missing, invalid, expired, or revoked
  /v1/auth/me:
    get:
      summary: Get current logged-in user profile
      tags:
        - Auth
      security:
        - bearer: []
      responses:
        '200':
          description: User profile retrieved successfully
        '401':
          description: Unauthorized
  /v1/auth/update-profile:
    put:
      summary: Update user profile
      tags:
        - Auth
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Profile updated successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /v1/auth/logout:
    post:
      summary: Logout user (revokes the stored refresh token)
      tags:
        - Auth
      security:
        - bearer: []
      responses:
        '201':
          description: User logged out successfully
        '401':
          description: Unauthorized
  /v1/auth/delete-account:
    delete:
      summary: Delete user account
      tags:
        - Auth
      security:
        - bearer: []
      responses:
        '200':
          description: Account deleted successfully
        '401':
          description: Unauthorized
