# Monorepo-wide orchestration. Each part of the stack owns its own
# docker-compose.yml (backend/, web/, "AI Microservice/") — this file only
# `include`s them so `docker compose up` from the repo root brings
# everything up together, in the right order (each included file's own
# healthchecks/depends_on still apply). Edit the owning file, not this one,
# unless the change is genuinely cross-cutting.
#
# Host ports, once everything is up:
#   http://localhost:8080       web — the app. /v1, /health and /socket.io are
#                               reverse-proxied to the backend from here, so this
#                               is the only address a user (or the browser) needs.
#   http://localhost:8080/api/docs  Swagger, through the same proxy.
#   http://localhost:3001       backend, direct (for curl / the e2e suite).
#   http://localhost:8000       AI microservice, direct (for curl / its own tests).
#   localhost:5434              backend Postgres.
#   localhost:5433              the AI microservice's own pgvector Postgres.
name: eco-match

include:
  - backend/docker-compose.yml
  - web/docker-compose.yml
  - "AI Microservice/docker-compose.yml"

# The AI FastAPI app (service "ai-service" in AI Microservice/docker-compose.yml)
# runs in-network now, reachable from the backend container at
# http://ai-service:8000 -- not host.docker.internal, that was only needed
# back when it ran natively on the host. "AI Microservice/fine_tuned_model/"
# is not committed to the repo (~420MB) and doesn't need to exist beforehand:
# its entrypoint.sh trains it on first boot (~5 min, see fine_tune.py) and
# writes the result to that bind-mounted path, so later `up` calls skip
# training and start immediately.
